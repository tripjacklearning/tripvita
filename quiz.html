<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --soft: #f5f4f2; --white: #ffffff; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .card { width: 100%; max-width: 550px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; margin: 0; font-size: 28px; }
        .timer-container { text-align: center; margin-bottom: 25px; padding: 20px; background: #fffcf9; border-radius: 20px; border: 1px dashed #ffd8b5; }
        #timer { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; color: var(--dark); line-height: 1; }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; }
        .opt { width: 100%; padding: 16px; margin: 8px 0; border: 2px solid #eee; border-radius: 14px; background: #fff; text-align: left; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        .btn { width: 100%; padding: 18px; background: var(--dark); color: white; border: none; border-radius: 14px; font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
        .cat-tag { font-size: 10px; padding: 4px 8px; background: #eee; border-radius: 5px; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <div class="brand-header"><h1>TripVita</h1><div style="color:var(--orange); font-weight:700; font-size:11px; letter-spacing:2px;">APRIL EDITION</div></div>
    <div id="loading-team" style="text-align:center; color:#888;">Preparing Arena...</div>
    <div id="step-1" class="hidden">
        <select id="userSelector" style="width:100%"></select>
        <button class="btn" id="sendBtn" onclick="sendOTP()" style="margin-top:25px;">Request Access Code</button>
        <div id="verify-box" class="hidden">
            <input type="text" id="otpIn" placeholder="4-Digit Code" maxlength="4" style="width:100%; padding:15px; text-align:center; font-size:24px; font-weight:800; margin-top:15px; border-radius:12px; border:2px solid #eee;">
            <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div class="status-bar"><span>QUESTION <span id="qNum">1</span> / <span id="totalQs">--</span></span><span id="qCat" style="color:var(--orange)">-</span></div>
    <div class="timer-container"><div id="timer">06:00</div></div>
    <h2 id="qText" style="font-family:'Syne'; font-size:20px; margin-bottom:20px;"></h2>
    <div id="optContainer"></div>
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <h1 style="font-family:'Syne'">Summary</h1>
    <div id="scoreDisplay" style="font-size:60px; font-family:'Syne'; color:var(--orange); margin:20px 0;">0/0</div>
    <div style="display:flex; justify-content: space-around; margin-bottom:30px;">
        <div><div style="font-size:12px; color:#888;">PORTAL</div><b id="pScore">0</b></div>
        <div><div style="font-size:12px; color:#888;">HOTELS</div><b id="hScore">0</b></div>
    </div>
    <button class="btn" onclick="location.href='leaderboard.html'">View Standings</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "YOUR_SCRIPT_URL";
    let qs = [], cur = 0, portalScore = 0, hotelScore = 0, spent = 0, timer, user = null, responses = [];

    $(document).ready(async function() {
        const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
        const team = await res.json();
        const sel = $('#userSelector');
        sel.append(new Option("", ""));
        team.forEach(p => sel.append(new Option(`${p.name} (${p.empId})`, JSON.stringify(p))));
        sel.select2({ placeholder: "Search Name..." });
        $('#loading-team').addClass('hidden'); $('#step-1').removeClass('hidden');
    });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        $('#sendBtn').text("Sending...").attr('disabled', true);
        const c = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        if((await c.json()).exists) { alert("Already submitted!"); location.reload(); return; }
        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden'); $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = $('#otpIn').val();
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        if((await res.json()).valid) {
            qs = await (await fetch(`${SCRIPT_URL}?action=getQuestions`)).json();
            $('#reg-area').addClass('hidden'); $('#quiz-area').removeClass('hidden');
            $('#totalQs').text(qs.length);
            timer = setInterval(() => { spent++; 
                let rem = 360 - spent;
                $('#timer').text(Math.floor(rem/60) + ":" + (rem%60).toString().padStart(2,'0'));
                if(rem <= 0) finish();
            }, 1000);
            renderQ();
        } else alert("Invalid code.");
    }

    function renderQ() {
        const q = qs[cur];
        $('#qNum').text(cur + 1); $('#qText').text(q.question); $('#qCat').text(q.category);
        const container = $('#optContainer').empty(); $('#nextBtn').addClass('hidden');
        
        q.options.forEach(o => {
            const b = $('<button class="opt">').text(o).appendTo(container);
            b.click(function() {
                $('.opt').attr('disabled', true);
                const isCorrect = (o === q.answer);
                if(isCorrect) { 
                    $(this).addClass('correct'); 
                    if(q.category.toLowerCase().includes('portal')) portalScore++; else hotelScore++;
                } else $(this).addClass('wrong');
                
                responses.push({ id: q.id, result: isCorrect ? "Correct" : "Incorrect" });
                $('#nextBtn').removeClass('hidden');
            });
        });
    }

    function nextQ() { cur++; if(cur < qs.length) renderQ(); else finish(); }

    async function finish() {
        clearInterval(timer);
        $('#quiz-area').addClass('hidden'); $('#result-area').removeClass('hidden');
        const total = portalScore + hotelScore;
        $('#scoreDisplay').text(total + "/" + qs.length);
        $('#pScore').text(portalScore); $('#hScore').text(hotelScore);
        
        const data = { 
            name: user.name, empId: user.empId, email: user.email, 
            totalScore: total, portalScore, hotelScore, 
            timeFormatted: Math.floor(spent/60) + ":" + (spent%60).toString().padStart(2,'0'),
            responses: responses 
        };
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
    }
</script>
</body>
</html>
