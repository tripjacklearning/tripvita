<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April | Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --soft: #f5f4f2; --white: #ffffff; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; color: var(--dark); }
        
        .card { width: 100%; max-width: 550px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; position: relative; overflow: hidden; border: 1px solid #e5e4e2; }
        
        /* Branding Header */
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; margin: 0; font-size: 28px; letter-spacing: -0.5px; }
        .brand-header .tagline { color: var(--orange); font-weight: 700; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }

        /* Big Central Clock */
        .timer-container { text-align: center; margin-bottom: 30px; padding: 20px; background: #fffcf9; border-radius: 20px; border: 1px dashed #ffd8b5; }
        #timer { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; color: var(--dark); line-height: 1; }
        .timer-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--orange); margin-top: 8px; font-weight: 700; }

        /* Progress Bar */
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; font-weight: 600; color: #888; }
        .progress-pill { background: var(--dark); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; }

        /* Quiz Elements */
        h2#qText { font-family: 'Syne', sans-serif; font-size: 22px; line-height: 1.3; margin-bottom: 25px; }
        .opt { width: 100%; padding: 18px; margin: 10px 0; border: 2px solid #eee; border-radius: 16px; background: var(--white); text-align: left; cursor: pointer; font-family: inherit; font-size: 16px; transition: all 0.2s ease; font-weight: 500; }
        .opt:hover:not(:disabled) { border-color: var(--orange); background: #fff9f4; transform: translateY(-2px); }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; transition: 0.3s; letter-spacing: 1px; }
        .btn:hover { background: #333; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .exp-box { padding: 20px; background: #f0f7ff; border-radius: 16px; margin-top: 20px; font-size: 14px; line-height: 1.6; border-left: 6px solid #007bff; }
        .hidden { display: none; }

        /* Registration/Selection Styles */
        .select2-container--default .select2-selection--single { height: 56px; border-radius: 16px; border: 2px solid #eee; display: flex; align-items: center; padding-left: 10px; font-family: 'DM Sans'; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <div class="brand-header">
        <h1>TripVita</h1>
        <div class="tagline">April Edition 2026</div>
    </div>
    
    <div id="loading-team" style="text-align:center; padding: 20px; color: #888;">Initializing arena...</div>
    
    <div id="step-1" class="hidden">
        <p style="text-align:center; margin-bottom: 20px; color: #666;">Select your name to begin the challenge</p>
        <select id="userSelector" style="width: 100%;"></select>
        
        <div id="otp-section" class="hidden" style="margin-top:30px; border-top:1px solid #eee; padding-top:25px;">
            <p style="font-size:13px; text-align:center; color:#666; margin-bottom: 15px;">A code will be sent to your official email</p>
            <button class="btn" id="sendBtn" onclick="sendOTP()">Request Access Code</button>
            
            <div id="verify-box" class="hidden">
                <input type="text" id="otpIn" placeholder="Enter 4-Digit Code" maxlength="4" style="width:100%; padding:18px; text-align:center; font-size:24px; font-weight:800; border:2px solid #eee; border-radius:16px; margin-top:10px; font-family: 'Syne'; letter-spacing: 8px;">
                <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
            </div>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div class="status-bar">
        <span>QUESTION <span id="qNum">1</span>/10</span>
        <span class="progress-pill">APRIL CHALLENGE</span>
    </div>

    <div class="timer-container">
        <div id="timer">06:00</div>
        <div class="timer-label">Time Remaining</div>
    </div>

    <h2 id="qText"></h2>
    <div id="optContainer"></div>
    <div id="expBox" class="exp-box hidden"></div>
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <div class="brand-header">
        <h1>TripVita</h1>
        <div class="tagline">Challenge Complete</div>
    </div>
    <div style="font-size: 14px; text-transform: uppercase; color: #888; font-weight: 700; margin-top: 20px;">Your Final Score</div>
    <div id="scoreDisplay" style="font-size:90px; font-family:'Syne'; color:var(--orange); line-height:1; margin: 10px 0;">0/0</div>
    <p id="saveMsg" style="color: #666; margin-bottom: 30px;">Syncing with Wall of Fame...</p>
    <button class="btn" onclick="location.href='leaderboard.html'">View Leaderboard</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";
    let qs = [], cur = 0, score = 0, time = 360, spent = 0, timer, user = null;

    $(document).ready(async function() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
            const team = await res.json();
            const sel = $('#userSelector');
            sel.append(new Option("", ""));
            team.forEach(p => sel.append(new Option(`${p.name} (${p.empId})`, JSON.stringify(p))));
            sel.select2({ placeholder: "Search your name..." });
            $('#loading-team').addClass('hidden');
            $('#step-1').removeClass('hidden');
        } catch(e) { $('#loading-team').text("Network error. Please refresh."); }
    });

    $('#userSelector').on('change', function() {
        if(this.value) $('#otp-section').removeClass('hidden');
    });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        const btn = document.getElementById('sendBtn');
        btn.disabled = true; btn.innerText = "Sending...";

        const c = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        const cD = await c.json();
        if(cD.exists) { alert("Duplicate attempt detected."); location.reload(); return; }

        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden');
        $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = document.getElementById('otpIn').value;
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        const data = await res.json();
        if(data.valid) {
            const qR = await fetch(`${SCRIPT_URL}?action=getQuestions`);
            qs = await qR.json();
            startQuiz();
        } else { alert("Invalid access code."); }
    }

    function startQuiz() {
        $('#reg-area').addClass('hidden');
        $('#quiz-area').removeClass('hidden');
        timer = setInterval(() => {
            time--; spent++;
            let m = Math.floor(time/60).toString().padStart(2,'0');
            let s = (time%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
            if(time <= 0) finish();
        }, 1000);
        renderQ();
    }

    function renderQ() {
        const q = qs[cur];
        document.getElementById('qNum').innerText = cur + 1;
        document.getElementById('qText').innerText = q.question;
        const container = document.getElementById('optContainer');
        container.innerHTML = "";
        document.getElementById('expBox').classList.add('hidden');
        document.getElementById('nextBtn').classList.add('hidden');

        q.options.forEach(o => {
            const b = document.createElement('button');
            b.className = "opt"; b.innerText = o;
            b.onclick = () => {
                $('.opt').attr('disabled', true);
                if(o === q.answer) { b.classList.add('correct'); score++; }
                else b.classList.add('wrong');
                document.getElementById('expBox').innerHTML = `<b>Key Insight:</b> ${q.explanation}`;
                document.getElementById('expBox').classList.remove('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            };
            container.appendChild(b);
        });
    }

    function nextQ() { cur++; if(cur < qs.length) renderQ(); else finish(); }

    async function finish() {
        clearInterval(timer);
        $('#quiz-area').addClass('hidden');
        $('#result-area').removeClass('hidden');
        document.getElementById('scoreDisplay').innerText = `${score}/${qs.length}`;
        const p = { 
            name: user.name, 
            empId: user.empId, 
            email: user.email, 
            region: user.location, 
            score, 
            totalQuestions: qs.length, 
            timeTakenSeconds: spent, 
            timeFormatted: Math.floor(spent/60) + ":" + (spent%60).toString().padStart(2,'0') 
        };
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(p) });
        document.getElementById('saveMsg').innerText = "Standings Updated!";
    }
</script>
</body>
</html>
