<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --soft: #f5f4f2; --white: #ffffff; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; color: var(--dark); }
        .card { width: 100%; max-width: 550px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; margin: 0; font-size: 28px; }
        .tagline { color: var(--orange); font-weight: 700; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 5px; }
        .timer-container { text-align: center; margin-bottom: 30px; padding: 20px; background: #fffcf9; border-radius: 20px; border: 1px dashed #ffd8b5; }
        #timer { font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; color: var(--dark); line-height: 1; }
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 13px; font-weight: 600; color: #888; }
        .opt { width: 100%; padding: 18px; margin: 10px 0; border: 2px solid #eee; border-radius: 16px; background: var(--white); text-align: left; cursor: pointer; font-size: 16px; font-weight: 500; transition: 0.2s; }
        .opt:hover:not(:disabled) { border-color: var(--orange); background: #fff9f4; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; }
        .exp-box { padding: 20px; background: #f0f7ff; border-radius: 16px; margin-top: 20px; font-size: 14px; border-left: 6px solid #007bff; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <div class="brand-header">
        <h1>TripVita</h1>
        <div class="tagline">April Edition 2026</div>
    </div>
    <div id="loading-team" style="text-align:center; color: #888;">Initializing...</div>
    <div id="step-1" class="hidden">
        <select id="userSelector" style="width: 100%;"></select>
        <div id="otp-section" class="hidden" style="margin-top:30px; border-top:1px solid #eee; padding-top:25px;">
            <button class="btn" id="sendBtn" onclick="sendOTP()">Request Access Code</button>
            <div id="verify-box" class="hidden">
                <input type="text" id="otpIn" placeholder="4-Digit Code" maxlength="4" style="width:100%; padding:18px; text-align:center; font-size:24px; font-weight:800; border:2px solid #eee; border-radius:16px; margin-top:10px; letter-spacing: 8px;">
                <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
            </div>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div class="status-bar">
        <span>QUESTION <span id="qNum">1</span> / <span id="totalQs">--</span></span>
        <span style="color:var(--orange)">APRIL CHALLENGE</span>
    </div>
    <div class="timer-container">
        <div id="timer">06:00</div>
        <div style="font-size:12px; text-transform:uppercase; color:var(--orange); font-weight:700;">Remaining</div>
    </div>
    <h2 id="qText" style="font-family:'Syne'"></h2>
    <div id="optContainer"></div>
    <div id="expBox" class="exp-box hidden"></div>
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <h1>Score</h1>
    <div id="scoreDisplay" style="font-size:90px; font-family:'Syne'; color:var(--orange);">0/0</div>
    <button class="btn" onclick="location.href='leaderboard.html'">View Leaderboard</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "YOUR_NEW_DEPLOYMENT_URL_HERE";
    let qs = [], cur = 0, score = 0, time = 360, spent = 0, timer, user = null;

    $(document).ready(async function() {
        const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
        const team = await res.json();
        const sel = $('#userSelector');
        sel.append(new Option("", ""));
        team.forEach(p => sel.append(new Option(`${p.name} (${p.empId})`, JSON.stringify(p))));
        sel.select2({ placeholder: "Search your name..." });
        $('#loading-team').addClass('hidden'); $('#step-1').removeClass('hidden');
    });

    $('#userSelector').on('change', function() { if(this.value) $('#otp-section').removeClass('hidden'); });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        $('#sendBtn').text("Sending...").attr('disabled', true);
        const c = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        const cD = await c.json();
        if(cD.exists) { alert("Already submitted!"); location.reload(); return; }
        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden'); $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = document.getElementById('otpIn').value;
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        const data = await res.json();
        if(data.valid) {
            const qR = await fetch(`${SCRIPT_URL}?action=getQuestions`);
            qs = await qR.json();
            $('#reg-area').addClass('hidden'); $('#quiz-area').removeClass('hidden');
            document.getElementById('totalQs').innerText = qs.length;
            timer = setInterval(() => {
                time--; spent++;
                let m = Math.floor(time/60).toString().padStart(2,'0'), s = (time%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
                if(time <= 0) finish();
            }, 1000);
            renderQ();
        } else alert("Invalid code.");
    }

    function renderQ() {
        const q = qs[cur];
        document.getElementById('qNum').innerText = cur + 1;
        document.getElementById('qText').innerText = q.question;
        const container = document.getElementById('optContainer');
        container.innerHTML = ""; $('#expBox, #nextBtn').addClass('hidden');
        q.options.forEach(o => {
            const b = document.createElement('button'); b.className="opt"; b.innerText=o;
            b.onclick = () => {
                $('.opt').attr('disabled', true);
                if(o === q.answer) { b.classList.add('correct'); score++; } else b.classList.add('wrong');
                document.getElementById('expBox').innerHTML = `<b>Key Insight:</b> ${q.explanation}`;
                $('#expBox, #nextBtn').removeClass('hidden');
            };
            container.appendChild(b);
        });
    }

    function nextQ() { cur++; if(cur < qs.length) renderQ(); else finish(); }

    async function finish() {
        clearInterval(timer);
        $('#quiz-area').addClass('hidden'); $('#result-area').removeClass('hidden');
        document.getElementById('scoreDisplay').innerText = `${score}/${qs.length}`;
        const p = { name: user.name, empId: user.empId, email: user.email, region: user.location, score, totalQuestions: qs.length, timeTakenSeconds: spent, timeFormatted: Math.floor(spent/60) + ":" + (spent%60).toString().padStart(2,'0') };
        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(p) });
    }
</script>
</body>
</html>
