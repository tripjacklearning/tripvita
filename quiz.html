<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita | Challenge Closed</title>
    <style>
        :root { --primary: #EF7F1A; --dark: #1A1A1A; --bg: #fdfcfb; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center;
        }
        .container { 
            width: 90%; 
            max-width: 500px; 
            background: white; 
            padding: 50px 30px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border-top: 8px solid var(--primary);
        }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: var(--dark); font-size: 24px; line-height: 1.4; margin: 0; }
        .highlight { color: var(--primary); font-weight: bold; }
        .footer-logo { 
            margin-top: 30px; 
            font-size: 14px; 
            font-weight: 800; 
            letter-spacing: 2px; 
            color: #ccc; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">✨</div>
    <h1>
        Thank you for the participation, we'll be back with a new challenge in <span class="highlight">April TripVita Edition</span>
    </h1>
    
    <div class="footer-logo">TripVita</div>
</div>

</body>
</html>
