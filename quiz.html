<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --white: #ffffff; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f4f2; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 550px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; }
        #timer { font-family: 'Syne', sans-serif; font-size: 50px; font-weight: 800; text-align: center; color: var(--dark); margin-bottom: 20px; }
        .opt { width: 100%; padding: 18px; margin: 8px 0; border: 2px solid #eee; border-radius: 16px; background: #fff; text-align: left; cursor: pointer; font-size: 16px; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <h1 style="font-family:'Syne'; text-align:center;">TripVita</h1>
    <div id="loader" style="text-align:center;">Loading Arena...</div>
    <div id="step-1" class="hidden">
        <select id="userSelector" style="width:100%"></select>
        <button class="btn" id="sendBtn" onclick="sendOTP()">Request Code</button>
        <div id="verify-box" class="hidden">
            <input type="text" id="otpIn" placeholder="4-Digit Code" maxlength="4" style="width:100%; padding:15px; text-align:center; font-size:24px; margin-top:15px; border-radius:12px; border:2px solid #eee;">
            <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div id="timer">06:00</div>
    <div id="qCat" style="text-align:center; color:var(--orange); font-weight:700; font-size:12px; margin-bottom:10px;">CATEGORY</div>
    <h2 id="qText" style="font-family:'Syne'; font-size:22px;"></h2>
    <div id="optContainer"></div>
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <h1 style="font-family:'Syne'">Summary</h1>
    <div id="scoreDisplay" style="font-size:70px; font-family:'Syne'; color:var(--orange);">0/0</div>
    <div style="display:flex; justify-content: space-around; margin: 20px 0;">
        <div>Portal: <b id="pScore">0</b></div>
        <div>Hotels: <b id="hScore">0</b></div>
    </div>
    <p>Results saved to Leaderboard.</p>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    // REPLACE THIS URL WITH YOUR NEW DEPLOYMENT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";
    
    let qs = [], cur = 0, pScore = 0, hScore = 0, spent = 0, timer, user = null, responses = [];

    $(document).ready(async function() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
            const data = await res.json();
            data.forEach(p => $('#userSelector').append(new Option(p.name + " (" + p.empId + ")", JSON.stringify(p))));
            $('#userSelector').select2({placeholder: "Select Name"});
            $('#loader').addClass('hidden'); $('#step-1').removeClass('hidden');
        } catch(e) { alert("Error connecting to sheet. Check your SCRIPT_URL."); }
    });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        $('#sendBtn').text("Sending...").attr('disabled', true);
        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden'); $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = $('#otpIn').val();
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        const data = await res.json();
        if(data.valid) {
            const qData = await fetch(`${SCRIPT_URL}?action=getQuestions`);
            qs = await qData.json();
            $('#reg-area').addClass('hidden'); $('#quiz-area').removeClass('hidden');
            timer = setInterval(() => { spent++; 
                let rem = 360 - spent;
                $('#timer').text(Math.floor(rem/60) + ":" + (rem%60).toString().padStart(2,'0'));
                if(rem <= 0) finish();
            }, 1000);
            renderQ();
        } else alert("Invalid code.");
    }

    function renderQ() {
        const q = qs[cur];
        $('#qText').text(q.question); $('#qCat').text(q.category.toUpperCase());
        const container = $('#optContainer').empty(); $('#nextBtn').addClass('hidden');
        q.options.forEach(o => {
            const b = $('<button class="opt">').text(o).appendTo(container);
            b.click(function() {
                $('.opt').attr('disabled', true);
                const correct = (o === q.answer);
                if(correct) { 
                    $(this).addClass('correct'); 
                    if(q.category.toLowerCase().includes('portal')) pScore++; else hScore++;
                } else $(this).addClass('wrong');
                responses.push({id: q.id, result: correct ? "Correct" : "Incorrect"});
                $('#nextBtn').removeClass('hidden');
            });
        });
    }

    function nextQ() { cur++; if(cur < qs.length) renderQ(); else finish(); }

    async function finish() {
        clearInterval(timer);
        $('#quiz-area').addClass('hidden'); $('#result-area').removeClass('hidden');
        $('#scoreDisplay').text((pScore + hScore) + "/" + qs.length);
        $('#pScore').text(pScore); $('#hScore').text(hScore);
        
        const payload = { 
            name: user.name, empId: user.empId, email: user.email, 
            totalScore: (pScore + hScore), portalScore: pScore, hotelScore: hScore, 
            timeFormatted: Math.floor(spent/60) + ":" + (spent%60).toString().padStart(2,'0'),
            responses: responses 
        };
        fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    }
</script>
</body>
</html>
