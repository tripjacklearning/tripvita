<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --soft: #f5f4f2; --white: #ffffff; --blue: #007bff; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; color: var(--dark); }
        
        .card { width: 100%; max-width: 550px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; position: relative; }
        
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; margin: 0; font-size: 28px; letter-spacing: -0.5px; }
        .tagline { color: var(--orange); font-weight: 700; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }

        /* Big Clock Style */
        .timer-container { text-align: center; margin-bottom: 25px; padding: 15px; background: #fffcf9; border-radius: 20px; border: 1px dashed #ffd8b5; }
        #timer { font-family: 'Syne', sans-serif; font-size: 54px; font-weight: 800; color: var(--dark); line-height: 1; }

        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; }

        /* Options */
        .opt { width: 100%; padding: 18px; margin: 8px 0; border: 2px solid #eee; border-radius: 16px; background: var(--white); text-align: left; cursor: pointer; font-size: 16px; transition: 0.2s; font-family: inherit; }
        .opt:hover:not(:disabled) { border-color: var(--orange); background: #fff9f4; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: 700; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        /* Restored Explanation Box */
        .exp-box { padding: 20px; border-radius: 16px; margin-top: 20px; font-size: 14px; line-height: 1.5; border-left: 6px solid var(--blue); background: #f0f7ff; }
        .exp-box.correct-bg { background: #e6f4ea; border-left-color: #28a745; color: #1e4620; }
        .exp-box.wrong-bg { background: #fdf2f2; border-left-color: #dc3545; color: #611a15; }

        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #333; transform: translateY(-2px); }
        
        .hidden { display: none; }
        .category-pill { background: #eee; padding: 4px 10px; border-radius: 6px; font-size: 10px; color: #555; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <div class="brand-header">
        <h1>TripVita</h1>
        <div class="tagline">April Edition</div>
    </div>
    <div id="loading-msg" style="text-align:center; color:#888;">Syncing Team Database...</div>
    <div id="step-1" class="hidden">
        <select id="userSelector" style="width: 100%;"></select>
        <div id="otp-section" class="hidden" style="margin-top:30px; border-top:1px solid #eee; padding-top:25px;">
            <button class="btn" id="sendBtn" onclick="sendOTP()">Request Access Code</button>
            <div id="verify-box" class="hidden">
                <input type="text" id="otpIn" placeholder="4-Digit Code" maxlength="4" style="width:100%; padding:18px; text-align:center; font-size:24px; font-weight:800; border:2px solid #eee; border-radius:16px; margin-top:15px; font-family: 'Syne'; letter-spacing: 5px;">
                <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
            </div>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div class="status-bar">
        <span>QUESTION <span id="qNum">1</span> / <span id="totalQs">--</span></span>
        <span class="category-pill" id="qCat">CATEGORY</span>
    </div>
    <div class="timer-container">
        <div id="timer">06:00</div>
    </div>
    <h2 id="qText" style="font-family: 'Syne'; font-size: 22px; margin-top: 0;"></h2>
    <div id="optContainer"></div>
    
    <div id="expBox" class="exp-box hidden"></div>
    
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <div class="brand-header">
        <h1>TripVita</h1>
        <div class="tagline">Challenge Complete</div>
    </div>
    <div id="scoreDisplay" style="font-size:80px; font-family:'Syne'; color:var(--orange); line-height:1; margin: 20px 0;">0/0</div>
    
    <div style="display:flex; justify-content: space-around; margin-bottom:30px; background: #fafafa; padding: 15px; border-radius: 15px;">
        <div><div style="font-size:11px; color:#888;">PORTAL</div><b id="pScore" style="font-size:20px;">0</b></div>
        <div><div style="font-size:11px; color:#888;">HOTELS</div><b id="hScore" style="font-size:20px;">0</b></div>
    </div>

    <button class="btn" onclick="window.location.href='https://docs.google.com/spreadsheets/d/1KbkBs7bMyUaNgeBb8FanXdDuuNp7GHqy-Dq_Ng4HJrQ/edit#gid=0'">View Leaderboard</button>
    <p style="font-size: 12px; color: #888; margin-top: 15px;">Your results have been synced automatically.</p>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";
    let qs = [], cur = 0, pScore = 0, hScore = 0, spent = 0, timer, user = null, responses = [];

    $(document).ready(async function() {
        const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
        const team = await res.json();
        const sel = $('#userSelector');
        sel.append(new Option("", ""));
        team.forEach(p => sel.append(new Option(`${p.name} (${p.empId})`, JSON.stringify(p))));
        sel.select2({ placeholder: "Find your name..." });
        $('#loading-msg').addClass('hidden'); $('#step-1').removeClass('hidden');
    });

    $('#userSelector').on('change', function() { if(this.value) $('#otp-section').removeClass('hidden'); });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        $('#sendBtn').text("Sending...").attr('disabled', true);
        const c = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        if((await c.json()).exists) { alert("Already submitted!"); location.reload(); return; }
        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden'); $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = $('#otpIn').val();
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        if((await res.json()).valid) {
            qs = await (await fetch(`${SCRIPT_URL}?action=getQuestions`)).json();
            $('#reg-area').addClass('hidden'); $('#quiz-area').removeClass('hidden');
            $('#totalQs').text(qs.length);
            timer = setInterval(() => { spent++; 
                let rem = 360 - spent;
                $('#timer').text(Math.floor(rem/60) + ":" + (rem%60).toString().padStart(2,'0'));
                if(rem <= 0) finish();
            }, 1000);
            renderQ();
        } else alert("Invalid code.");
    }

    function renderQ() {
        const q = qs[cur];
        $('#qNum').text(cur + 1); $('#qText').text(q.question); $('#qCat').text(q.category);
        const container = $('#optContainer').empty(); 
        $('#expBox, #nextBtn').addClass('hidden').removeClass('correct-bg wrong-bg');
        
        q.options.forEach(o => {
            const b = $('<button class="opt">').text(o).appendTo(container);
            b.click(function() {
                $('.opt').attr('disabled', true);
                const isCorrect = (o === q.answer);
                
                // Visual Feedback
                if(isCorrect) { 
                    $(this).addClass('correct'); 
                    $('#expBox').addClass('correct-bg').html(`<b>✓ Correct!</b><br>${q.explanation}`);
                    if(q.category.toLowerCase().includes('portal')) pScore++; else hScore++;
                } else { 
                    $(this).addClass('wrong'); 
                    $('#expBox').addClass('wrong-bg').html(`<b>× Incorrect</b><br>${q.explanation}`);
                }
                
                responses.push({ id: q.id, result: isCorrect ? "Correct" : "Incorrect" });
                $('#expBox, #nextBtn').removeClass('hidden');
            });
        });
    }

    function nextQ() { cur++; if(cur < qs.length) renderQ(); else finish(); }

    async function finish() {
        clearInterval(timer);
        $('#quiz-area').addClass('hidden'); $('#result-area').removeClass('hidden');
        $('#scoreDisplay').text((pScore + hScore) + "/" + qs.length);
        $('#pScore').text(pScore); $('#hScore').text(hScore);
        
        const payload = { 
            name: user.name, empId: user.empId, email: user.email, 
            totalScore: (pScore + hScore), portalScore: pScore, hotelScore: hScore, 
            timeFormatted: Math.floor(spent/60) + ":" + (spent%60).toString().padStart(2,'0'),
            responses: responses 
        };
        fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    }
</script>
</body>
</html>
