<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripVita — July 2026</title>

<!-- Fallback redirect if JS is disabled -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/tripjack.com/s/AKfycbx5SaYUtrQZQYpKemYSWHj11hM5nBnbyq_ZvgOjeT9FShYCrscMbxN-6h7dUbJrQC_q/exec">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#F2F4F8;color:#1A202C;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid #DDE1EA;border-radius:16px;
        box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:40px 36px;text-align:center;max-width:420px;width:100%;}
  .logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;}
  .logo-mark{width:30px;height:30px;background:#1B3F7A;border-radius:7px;
             display:flex;align-items:center;justify-content:center;}
  .logo-mark span{color:#EF7F1A;font-weight:800;font-size:15px;}
  .logo-name{font-size:15px;font-weight:700;color:#1B3F7A;}
  .logo-name em{font-style:normal;color:#EF7F1A;}
  .title{font-size:24px;font-weight:800;color:#1B3F7A;letter-spacing:-0.5px;}
  .title span{color:#EF7F1A;}
  .sub{font-size:11px;font-weight:600;color:#718096;text-transform:uppercase;
       letter-spacing:2px;margin-top:4px;margin-bottom:26px;}
  .spinner{width:34px;height:34px;border:3px solid #DDE1EA;border-top-color:#EF7F1A;
           border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .msg{font-size:14px;color:#4A5568;line-height:1.7;}
  .manual{margin-top:22px;padding-top:20px;border-top:1px solid #EEF2FA;font-size:13px;color:#718096;line-height:1.6;}
  .btn{display:inline-block;margin-top:12px;background:#EF7F1A;color:#fff;text-decoration:none;
       font-size:14px;font-weight:700;padding:12px 26px;border-radius:10px;}
  .btn:hover{background:#d97116;}
  .note{margin-top:18px;font-size:12px;color:#A0AEC0;line-height:1.6;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark"><span>T</span></div>
      <div class="logo-name">Trip<em>Jack</em> &nbsp;·&nbsp; TripVita</div>
    </div>

    <div class="title">Trip<span>Vita</span></div>
    <div class="sub">July 2026 · Monthly Assessment</div>

    <div class="spinner"></div>
    <p class="msg">Taking you to the quiz…</p>

    <div class="manual">
      Not redirected automatically?
      <br>
      <a class="btn" id="go" href="https://script.google.com/a/macros/tripjack.com/s/AKfycbx5SaYUtrQZQYpKemYSWHj11hM5nBnbyq_ZvgOjeT9FShYCrscMbxN-6h7dUbJrQC_q/exec">Open the Quiz →</a>
    </div>

    <p class="note">
      Sign in with your <strong>@tripjack.com</strong> account when prompted.
    </p>
  </div>

<script>
  // Immediate redirect. replace() keeps this shim out of back-button history,
  // so "Back" from the quiz doesn't bounce the user straight back here again.
  window.location.replace(document.getElementById('go').href);
</script>
</body>
</html>
