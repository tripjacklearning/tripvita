<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --white: #ffffff; --bg: #f5f4f2; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; color: var(--dark); }
        .card { width: 100%; max-width: 500px; background: var(--white); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; position: relative; }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; margin: 0; font-size: 28px; }
        
        /* Timer Style */
        .timer-container { text-align: center; margin-bottom: 25px; padding: 15px; background: #fffcf9; border-radius: 20px; border: 1px dashed #ffd8b5; }
        #timer { font-family: 'Syne', sans-serif; font-size: 54px; font-weight: 800; line-height: 1; color: var(--dark); }

        /* Options & Feedback */
        .opt { width: 100%; padding: 18px; margin: 8px 0; border: 2px solid #eee; border-radius: 16px; background: #fff; text-align: left; cursor: pointer; font-size: 16px; font-family: inherit; transition: 0.2s; }
        .opt:hover:not(:disabled) { border-color: var(--orange); background: #fff9f4; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: 700; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        
        .exp-box { padding: 20px; border-radius: 16px; margin-top: 20px; font-size: 14px; line-height: 1.5; border-left: 6px solid #007bff; background: #f0f7ff; }
        .correct-bg { background: #e6f4ea; border-left-color: #28a745; color: #1e4620; }
        .wrong-bg { background: #fdf2f2; border-left-color: #dc3545; color: #611a15; }

        .btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 16px; font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
        #qCat { color: var(--orange); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="card" id="reg-area">
    <div class="brand-header"><h1>TripVita</h1><div style="font-size:11px; font-weight:700; color:var(--orange); letter-spacing:3px;">APRIL EDITION</div></div>
    <div id="loader" style="text-align:center; color:#888;">Syncing Arena...</div>
    <div id="step-1" class="hidden">
        <select id="userSelector" style="width: 100%;"></select>
        <button class="btn" id="sendBtn" onclick="sendOTP()">Request Code</button>
        <div id="verify-box" class="hidden">
            <input type="text" id="otpIn" placeholder="Enter 4-Digit Code" maxlength="4" style="width:100%; padding:18px; text-align:center; font-size:24px; border:2px solid #eee; border-radius:16px; margin-top:15px; font-family: 'Syne'; letter-spacing: 5px;">
            <button class="btn" style="background:#28a745;" onclick="verifyOTP()">Verify & Start</button>
        </div>
    </div>
</div>

<div class="card hidden" id="quiz-area">
    <div class="timer-container"><div id="timer">06:00</div></div>
    <span id="qCat">CATEGORY</span>
    <h2 id="qText" style="font-family: 'Syne'; font-size: 22px; margin-top: 5px;"></h2>
    <div id="optContainer"></div>
    <div id="expBox" class="exp-box hidden"></div>
    <button id="nextBtn" class="btn hidden" onclick="nextQ()">Continue</button>
</div>

<div class="card hidden" id="result-area" style="text-align:center;">
    <div class="brand-header"><h1>TripVita</h1><div>CHALLENGE COMPLETE</div></div>
    <div id="scoreDisplay" style="font-size:80px; font-family:'Syne'; color:var(--orange); line-height:1; margin: 20px 0;">0/0</div>
    <div style="display:flex; justify-content: space-around; margin-bottom:30px; background: #fafafa; padding: 15px; border-radius: 15px;">
        <div><div style="font-size:11px; color:#888;">PORTAL</div><b id="pScore" style="font-size:20px;">0</b></div>
        <div><div style="font-size:11px; color:#888;">HOTELS</div><b id="hScore" style="font-size:20px;">0</b></div>
    </div>
    <button class="btn" onclick="window.location.href='https://docs.google.com/spreadsheets/d/1KbkBs7bMyUaNgeBb8FanXdDuuNp7GHqy-Dq_Ng4HJrQ/edit#gid=0'">View Leaderboard</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";
    
    let qs = [], cur = 0, pScore = 0, hScore = 0, spent = 0, timerInterval = null, user = null, responses = [];
    let isSubmitting = false;

    // Initialize Team List
    $(document).ready(async function() {
        const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
        const team = await res.json();
        team.forEach(p => $('#userSelector').append(new Option(p.name, JSON.stringify(p))));
        $('#userSelector').select2({ placeholder: "Search your name..." });
        $('#loader').addClass('hidden'); $('#step-1').removeClass('hidden');
    });

    async function sendOTP() {
        user = JSON.parse($('#userSelector').val());
        $('#sendBtn').text("Sending...").attr('disabled', true);
        
        // Duplicate Check
        const check = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        if((await check.json()).exists) { alert("You have already submitted for this month!"); location.reload(); return; }
        
        await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(user.email)}`);
        $('#sendBtn').addClass('hidden'); $('#verify-box').removeClass('hidden');
    }

    async function verifyOTP() {
        const otp = $('#otpIn').val();
        const res = await fetch(`${SCRIPT_URL}?action=verifyOTP&email=${encodeURIComponent(user.email)}&otp=${otp}`);
        if((await res.json()).valid) {
            const qData = await fetch(`${SCRIPT_URL}?action=getQuestions`);
            qs = await qData.json();
            $('#reg-area').addClass('hidden'); $('#quiz-area').removeClass('hidden');
            
            // TIMER START (Fixed: One single interval)
            spent = 0;
            timerInterval = setInterval(() => {
                spent++;
                let rem = 360 - spent;
                let m = Math.floor(rem/60).toString().padStart(2, '0');
                let s = (rem%60).toString().padStart(2, '0');
                $('#timer').text(`${m}:${s}`);
                if(rem <= 0) finish();
            }, 1000);
            
            renderQ();
        } else alert("Incorrect Code.");
    }

    function renderQ() {
        const q = qs[cur];
        $('#qText').text(q.question); 
        $('#qCat').text(q.category.toUpperCase());
        const container = $('#optContainer').empty();
        $('#expBox, #nextBtn').addClass('hidden').removeClass('correct-bg wrong-bg');

        q.options.forEach(o => {
            const b = $('<button class="opt">').text(o).appendTo(container);
            b.click(function() {
                $('.opt').attr('disabled', true);
                const isCorrect = (o === q.answer);
                
                if(isCorrect) {
                    $(this).addClass('correct');
                    $('#expBox').addClass('correct-bg').html(`<b>✓ Correct!</b><br>${q.explanation}`);
                    if(q.category.toLowerCase().includes('portal')) pScore++; else hScore++;
                } else {
                    $(this).addClass('wrong');
                    $('#expBox').addClass('wrong-bg').html(`<b>× Incorrect</b><br>${q.explanation}`);
                }
                
                responses.push({ id: q.id, result: isCorrect ? "Correct" : "Incorrect" });
                $('#expBox, #nextBtn').removeClass('hidden');
            });
        });
    }

    function nextQ() {
        cur++;
        if(cur < qs.length) renderQ();
        else finish();
    }

    async function finish() {
        if(isSubmitting) return; // Prevent double trigger
        isSubmitting = true;
        
        clearInterval(timerInterval);
        $('#quiz-area').addClass('hidden'); $('#result-area').removeClass('hidden');
        
        const total = pScore + hScore;
        $('#scoreDisplay').text(`${total}/${qs.length}`);
        $('#pScore').text(pScore); $('#hScore').text(hScore);

        const payload = {
            name: user.name, empId: user.empId, email: user.email,
            totalScore: total, portalScore: pScore, hotelScore: hScore,
            timeFormatted: $('#timer').text(),
            responses: responses
        };

        // Submit Data
        fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    }
</script>
</body>
</html>
