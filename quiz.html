<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita April | Entrance</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --soft: #f5f4f2; }
        body { font-family: 'DM Sans', sans-serif; background: var(--soft); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { width: 100%; max-width: 500px; background: white; border-radius: 30px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); align-self: center; border: 1px solid #e5e4e2; }
        h1 { font-family: 'Syne', sans-serif; text-transform: uppercase; text-align: center; margin-bottom: 5px; }
        .tagline { color: var(--orange); text-align: center; font-weight: 700; letter-spacing: 2px; font-size: 12px; margin-bottom: 30px; }
        .select2-container--default .select2-selection--single { height: 50px; border-radius: 12px; border: 2px solid #eee; display: flex; align-items: center; }
        .btn { width: 100%; padding: 18px; background: var(--dark); color: white; border: none; border-radius: 15px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; margin-top: 20px; }
        .hidden { display: none; }
        .loading-spinner { text-align: center; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="card" id="login-card">
    <h1>TripVita</h1>
    <div class="tagline">April Edition 2026</div>
    
    <div id="loading-team" class="loading-spinner">Fetching team list...</div>
    
    <div id="form-content" class="hidden">
        <p style="text-align:center; font-size: 14px; color: #666; margin-bottom: 15px;">Search and select your name to begin</p>
        <select id="nameSelect" style="width: 100%;"></select>
        <button class="btn" id="startBtn" onclick="checkAndStart()">START CHALLENGE</button>
    </div>
    <p id="error-msg" style="color:red; font-size:12px; text-align:center; margin-top:10px;"></p>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";

    $(document).ready(async function() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getTeam`);
            const team = await res.json();
            const select = $('#nameSelect');
            
            select.append(new Option("", ""));
            team.forEach(p => {
                select.append(new Option(`${p.name} (${p.empId})`, JSON.stringify(p)));
            });

            select.select2({ placeholder: "Type your name..." });
            $('#loading-team').addClass('hidden');
            $('#form-content').removeClass('hidden');
        } catch (err) {
            $('#loading-team').text("Failed to load team list. Please refresh.");
        }
    });

    async function checkAndStart() {
        const selectedData = $('#nameSelect').val();
        if (!selectedData) return alert("Please select your name.");

        const user = JSON.parse(selectedData);
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = "VERIFYING...";

        const check = await fetch(`${SCRIPT_URL}?action=checkDuplicate&empId=${user.empId}`);
        const res = await check.json();

        if (res.exists) {
            document.getElementById('error-msg').innerText = "Access Denied: You have already completed this edition.";
            btn.innerText = "LOCKED";
        } else {
            // Store user in SessionStorage and move to quiz logic
            sessionStorage.setItem('activeUser', JSON.stringify(user));
            // In a real setup, you'd hide this card and show the quiz-area div
            alert("Verification Successful! Starting Quiz...");
            // Trigger your renderQuestion() logic here
        }
    }
</script>
</body>
</html>
