<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita | Wall of Fame</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #EF7F1A; --dark: #111111; --gold: #FFD700; }
        body { font-family: 'DM Sans', sans-serif; background: #f5f4f2; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 32px; margin: 0; }
        .header p { color: var(--orange); font-weight: 700; letter-spacing: 2px; font-size: 12px; }

        .leaderboard-card { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .entry { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .entry:last-child { border-bottom: none; }
        .rank { width: 40px; font-family: 'Syne'; font-weight: 800; color: #bbb; font-size: 18px; }
        .entry:nth-child(1) .rank { color: var(--gold); }
        .entry:nth-child(2) .rank { color: #C0C0C0; }
        .entry:nth-child(3) .rank { color: #CD7F32; }

        .info { flex-grow: 1; }
        .info b { display: block; font-size: 16px; }
        .info span { font-size: 12px; color: #888; }

        .score-box { text-align: right; }
        .total-pts { font-family: 'Syne'; font-weight: 800; color: var(--orange); font-size: 20px; display: block; }
        .time-taken { font-size: 11px; color: #aaa; }

        .btn-back { display: block; text-align: center; margin-top: 30px; text-decoration: none; color: var(--dark); font-weight: 700; font-size: 14px; }
        
        #loading { text-align: center; padding: 50px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Wall of Fame</h1>
        <p>APRIL CHALLENGE 2026</p>
    </div>

    <div class="leaderboard-card">
        <div id="loading">Fetching Standings...</div>
        <div id="leaderboard-list"></div>
    </div>

    <a href="quiz.html" class="btn-back">← Back to Challenge</a>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXY58K-kSmCDSEb1sAOg9Qk_QjweKCrtnOunl5OEMFanY9AA4ZCxYL4Jhaol8INYuo/exec";

    async function loadLeaderboard() {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=getLeaderboard`);
            const data = await response.json();
            
            const list = document.getElementById('leaderboard-list');
            document.getElementById('loading').style.display = 'none';
            
            if (data.length === 0) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>No results yet. Be the first!</p>";
                return;
            }

            data.forEach((user, index) => {
                const item = document.createElement('div');
                item.className = 'entry';
                item.innerHTML = `
                    <div class="rank">${index + 1}</div>
                    <div class="info">
                        <b>${user.name}</b>
                        <span>P: ${user.portal} | H: ${user.hotels}</span>
                    </div>
                    <div class="score-box">
                        <span class="total-pts">${user.score}</span>
                        <span class="time-taken">${user.time}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        } catch (e) {
            document.getElementById('loading').innerText = "Error loading standings.";
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
