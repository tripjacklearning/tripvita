<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripVita | April Leaderboard</title>
    <style>
        :root { --primary: #EF7F1A; --dark: #1A1A1A; --bg: #fdfcfb; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; border-top: 8px solid var(--primary); }
        h1 { text-align: center; color: var(--dark); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #eee; color: #888; font-size: 12px; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-size: 15px; }
        .rank { font-weight: bold; color: var(--primary); width: 50px; }
        .score-pill { background: var(--dark); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; }
        .hidden { display: none; }
        .loading { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Leaderboard</h1>
    <p class="subtitle">April Edition - Top Performers</p>
    <div id="loader" class="loading">Loading standings...</div>
    <table id="lbTable" class="hidden">
        <thead><tr><th>Rank</th><th>Participant</th><th>Region</th><th>Score</th><th>Time</th></tr></thead>
        <tbody id="lbBody"></tbody>
    </table>
</div>
<script>
    const SCRIPT_URL = 'PASTE_YOUR_NEW_DEPLOYMENT_URL_HERE';
    async function loadLB() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getLeaderboard`);
            const data = await res.json();
            if (data.length === 0) { document.getElementById('loader').innerText = "No entries yet."; return; }
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('lbTable').classList.remove('hidden');
            const tbody = document.getElementById('lbBody');
            data.forEach((u, i) => {
                const row = document.createElement('tr');
                row.innerHTML = `<td>#${i+1}</td><td><b>${u.name}</b><br><small>${u.empId}</small></td><td>${u.region || '—'}</td><td><span class="score-pill">${u.score}/${u.total}</span></td><td>${u.timeFormatted}</td>`;
                tbody.appendChild(row);
            });
        } catch (e) { document.getElementById('loader').innerText = "Error loading data."; }
    }
    loadLB();
</script>
</body>
</html>
